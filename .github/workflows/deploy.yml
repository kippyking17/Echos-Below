name: Deploy Echos Below

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prevent old publishers from downgrading the game
        run: node .github/scripts/validate-release.cjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload game files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./echoes_below

      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
